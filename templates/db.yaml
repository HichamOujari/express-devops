apiVersion: {{ .Values.Apiversion }}
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ec.name" . }}-pvc
spec:
  accessModes:
    - {{ .Values.mysql.accessModes }}
  resources:
    requests:
      storage: {{ .Values.mysql.volume }}

---
apiVersion: "apps/{{ .Values.Apiversion }}"
kind: Deployment
metadata:
  name: {{ include "ec.name" . }}d-deployment
spec:
  replicas: {{ .Values.mysql.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ec.name" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "ec.name" . }}-mysql
    spec:
      containers:
        - name:  {{ .Values.mysql.name }}
          image:  {{ .Values.mysql.repository }}
          env:
            - name: MYSQL_USER
              value: {{ .Values.mysql.db_username }}
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.mysql.db_password }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.mysql.db_password }}
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: {{ include "ec.name" . }}-pvc

---
apiVersion: {{ .Values.Apiversion }}
kind: Service
metadata:
  name: {{ .Values.mysql.name }}-svc
spec:
  selector:
    app: {{ include "ec.name" . }}-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  clusterIP: None
